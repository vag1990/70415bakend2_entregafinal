<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ticket de Compra</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <h1 class="titulo-pagina">Gracias por tu compra</h1>

  <div class="ticket-container">
    <p><strong>Código del ticket:</strong> <span id="ticketCode"></span></p>
    <p><strong>Fecha de compra:</strong> <span id="ticketDate"></span></p>
    <p><strong>Monto total:</strong> $<span id="ticketAmount"></span></p>
    <p><strong>Comprador:</strong> <span id="ticketUser"></span></p>
  </div>

  <script src="/js/ticket.js"></script>
</body>
</html>
